<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outfit 150</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f3f3f3;
  color: #171717;
}

header {
  background: #111;
  color: white;
  padding: 28px 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 7px 0 0;
  opacity: .7;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 5px 20px rgba(0,0,0,.07);
}

.card h2 {
  margin-top: 0;
}

.outfit {
  display: grid;
  gap: 12px;
}

.item {
  border: 1px solid #ddd;
  border-radius: 14px;
  padding: 15px;
  background: #fafafa;
}

.item strong {
  display: block;
  font-size: 13px;
  text-transform: uppercase;
  color: #777;
  margin-bottom: 5px;
}

.item span {
  font-size: 19px;
  font-weight: 600;
}

button {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 16px;
  background: #111;
  color: white;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

.secondary {
  margin-top: 10px;
  background: #e9e9e9;
  color: #111;
}

.info {
  text-align: center;
  color: #777;
  font-size: 14px;
  margin-top: 18px;
}

select {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 10px;
  background: white;
  font-size: 16px;
}
</style>
</head>

<body>

<header>
  <h1>OUTFIT 150</h1>
  <p>Tu armario de trabajo</p>
</header>

<div class="container">

  <div class="card">
    <h2>Generador de outfit</h2>

    <label for="estilo">Estilo</label>
    <select id="estilo">
      <option value="todos">Cualquiera</option>
      <option value="formal">Más formal</option>
      <option value="casual">Más casual</option>
    </select>
  </div>

  <div class="card">
    <div class="outfit">

      <div class="item">
        <strong>Camisa</strong>
        <span id="camisa">Pulsa generar</span>
      </div>

      <div class="item">
        <strong>Jersey / Sudadera / Sobrecamisa</strong>
        <span id="capa">Pulsa generar</span>
      </div>

      <div class="item">
        <strong>Chinos</strong>
        <span id="chino">Pulsa generar</span>
      </div>

    </div>
  </div>

  <button onclick="generarOutfit()">
    ✨ Generar outfit
  </button>

  <button class="secondary" onclick="generarOutfit()">
    🔄 Cambiar combinación
  </button>

  <p class="info">
    Combinaciones pensadas para trabajar.
  </p>

</div>

<script>

const camisas = [
  {nombre: "Camisa blanca", estilo: "formal"},
  {nombre: "Camisa azul cielo", estilo: "formal"},
  {nombre: "Camisa azul marino", estilo: "formal"},
  {nombre: "Camisa gris claro", estilo: "formal"},
  {nombre: "Camisa beige", estilo: "casual"},
  {nombre: "Camisa de rayas azules", estilo: "formal"},
  {nombre: "Camisa de cuadros discretos", estilo: "casual"}
];

const capas = [
  {nombre: "Jersey azul marino", estilo: "formal"},
  {nombre: "Jersey gris", estilo: "formal"},
  {nombre: "Jersey beige", estilo: "formal"},
  {nombre: "Jersey verde oscuro", estilo: "casual"},
  {nombre: "Sudadera gris", estilo: "casual"},
  {nombre: "Sudadera azul marino", estilo: "casual"},
  {nombre: "Sobrecamisa beige", estilo: "casual"},
  {nombre: "Sobrecamisa verde oliva", estilo: "casual"},
  {nombre: "Sobrecamisa azul marino", estilo: "casual"}
];

const chinos = [
  {nombre: "Chinos beige", estilo: "formal"},
  {nombre: "Chinos azul marino", estilo: "formal"},
  {nombre: "Chinos grises", estilo: "formal"},
  {nombre: "Chinos verdes", estilo: "casual"},
  {nombre: "Chinos marrón claro", estilo: "casual"},
  {nombre: "Chinos negros", estilo: "formal"}
];

function aleatorio(lista) {
  return lista[Math.floor(Math.random() * lista.length)];
}

function generarOutfit() {

  const estilo = document.getElementById("estilo").value;

  let listaCamisas = camisas;
  let listaCapas = capas;
  let listaChinos = chinos;

  if (estilo !== "todos") {
    listaCamisas = camisas.filter(x => x.estilo === estilo);
    listaCapas = capas.filter(x => x.estilo === estilo);
    listaChinos = chinos.filter(x => x.estilo === estilo);
  }

  const camisa = aleatorio(listaCamisas);
  const capa = aleatorio(listaCapas);
  const chino = aleatorio(listaChinos);

  document.getElementById("camisa").textContent = camisa.nombre;
  document.getElementById("capa").textContent = capa.nombre;
  document.getElementById("chino").textContent = chino.nombre;
}

generarOutfit();

</script>

</body>
</html>
